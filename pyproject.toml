[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-canary"
version = "0.2.0"
description = "Tripwire detection for autonomous AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.38",
    "rich>=13.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
agent-canary = "agent_canary.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_canary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
